    <text x="1150" y="537" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#6F625A">VALIDAÇÃO · ERROS</text>
