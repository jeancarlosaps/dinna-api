    <text x="92" y="340" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-5.9" fill="#FBF6F0" text-anchor="start">dinna<tspan fill="#E08A5F">.</tspan></text>
