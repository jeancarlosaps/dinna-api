    <text x="98" y="510" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="500" fill="#CDBBAD">Produtos, pedidos e status em um monólito modular.</text>
