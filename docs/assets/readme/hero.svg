<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <!-- STILL-NOTE -->
  <!-- Keep hero-still.svg aligned with this composition. -->
  <title id="title">dinna. api — Da mesa à operação.</title>
  <desc id="desc">Ilustração conceitual da API do Dinna: o perfil cliente e o perfil restaurante do app Flutter conversam por REST com um único serviço Fastify. Dentro dele, o módulo health aparece como implementado; products, orders e recommendations aparecem tracejados, como planejados. Animação curta (menos de cinco segundos) que respeita a preferência de redução de movimento.</desc>
  <style>
    .a-copy { animation: fade .9s ease-out both; }
    .a-a { animation: rise .8s .3s cubic-bezier(.2,.7,.2,1) both; }
    .a-b { animation: rise .9s .6s cubic-bezier(.2,.7,.2,1) both; }
    .a-r1 { animation: fade .5s 1.1s both; } .a-r2 { animation: fade .5s 1.35s both; }
    .a-r3 { animation: fade .5s 1.6s both; } .a-r4 { animation: fade .5s 1.85s both; }
    .a-l1 { animation: fade .7s 1.3s ease-out both; }
    .a-l2 { animation: fade .7s 2.1s ease-out both; }
    .a-c { animation: rise .8s 2.4s cubic-bezier(.2,.7,.2,1) both; }
    .a-ping { transform-box: fill-box; transform-origin: center; animation: ping 1.2s 2.8s ease-out both; }
    .a-foot { animation: fade .8s 3s both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ping { 0% { transform: scale(.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#211915"/><stop offset=".6" stop-color="#2C211B"/><stop offset="1" stop-color="#3A2B22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#B4532A" stop-opacity=".30"/><stop offset="1" stop-color="#B4532A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="46" height="42" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.1" fill="#FBF6F0" opacity="0.06"/><circle cx="29" cy="23" r="0.9" fill="#FBF6F0" opacity="0.042"/><circle cx="16" cy="37" r="0.8" fill="#FBF6F0" opacity="0.048"/></pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E08A5F"/>
    </marker>
    <clipPath id="frame"><rect width="1600" height="680" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="680" fill="url(#bg)"/>
    <rect width="1600" height="680" fill="url(#dots)"/>
    <circle cx="1150" cy="340" r="380" fill="url(#glow)"/>
    <path d="M760 640 H1560" stroke="#57443A" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  </g>
  <rect x="1" y="1" width="1598" height="678" rx="27" fill="none" stroke="#57443A" stroke-width="2"/>

