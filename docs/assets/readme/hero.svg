    <text x="1032" y="208" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F625A">Fastify · TypeScript</text>
