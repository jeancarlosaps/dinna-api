<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap do Dinna por releases</title>
  <desc id="desc">R0 Fundação, entregue: app Flutter com MVVM, API Fastify com SQLite, contrato REST, models e CI. R1 MVP Operacional, MVP funcional: mesa, cardápio, busca, carrinho, pedido, status, fila, preparo e produtos; a rota /product ainda é provisória. R2 Dinna, implementado: Me ajuda a escolher, preferências salvas, escolha pelo Gemini com chave opcional e fallback determinístico. R3 Evoluções, planejado: QR Code da mesa, geolocalização, favoritos e dashboard.</desc>
