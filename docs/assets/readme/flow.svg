<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="530" viewBox="0 0 1600 530" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo planejado do pedido na dinna-api</title>
  <desc id="desc">Contrato planejado para R1: POST /orders cria o pedido como recebido; PATCH /orders/:id/status avança para preparando, pronto e finalizado; GET /orders lista a fila do restaurante. Ainda não implementado — hoje a API expõe apenas GET /health.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF6F0"/><stop offset="1" stop-color="#F3E8DC"/></linearGradient>
    <pattern id="dots" width="46" height="42" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.1" fill="#2A211C" opacity="0.06"/><circle cx="29" cy="23" r="0.9" fill="#2A211C" opacity="0.042"/><circle cx="16" cy="37" r="0.8" fill="#2A211C" opacity="0.048"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2A211C" flood-opacity=".10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B4532A"/></marker>
    
    <clipPath id="frame"><rect width="1600" height="530" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="530" fill="url(#bg)"/>
    <rect width="1600" height="530" fill="url(#dots)"/>
  </g>
  <rect x="1" y="1" width="1598" height="528" rx="27" fill="none" stroke="#E6DAD0" stroke-width="2"/>
  <text x="72" y="78" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#B4532A">CICLO DO PEDIDO  ·  CONTRATO PLANEJADO R1</text>
  <text x="72" y="126" font-family="'Iowan Old Style', Charter, 'Palatino Linotype', Georgia, serif" font-size="38" font-style="italic" fill="#2A211C">Da mesa à operação, em quatro estados.</text>
  <rect x="1389" y="58" width="139" height="34" rx="17" fill="#F6EAD2"/>
  <text x="1458.5" y="81" text-anchor="middle" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A86B12">PLANEJADO</text>
  <text x="72" y="248" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#2A211C">Mesa</text>
  <text x="72" y="274" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F625A">app Flutter</text>
  <path d="M180 258 H318" stroke="#B4532A" stroke-width="3" marker-end="url(#ar)"/>
  <text x="255.0" y="242" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#B4532A">POST /orders</text>
  <g>
    <rect x="330" y="196" width="240" height="124" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="330" y="196" width="240" height="124" rx="22" fill="none" stroke="#E6DAD0" stroke-width="1.5"/>
    <rect x="354" y="218" width="36" height="6" rx="3" fill="#B4532A"/>
    <text x="354" y="264" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" font-weight="700" fill="#2A211C">Recebido</text>
    <text x="354" y="294" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#6F625A">received</text>
  </g>
  <path d="M580 258 H638" stroke="#B4532A" stroke-width="3" marker-end="url(#ar)"/>
  <text x="610.0" y="242" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#B4532A">PATCH</text>
  <g>
    <rect x="650" y="196" width="240" height="124" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="650" y="196" width="240" height="124" rx="22" fill="none" stroke="#E6DAD0" stroke-width="1.5"/>
    <rect x="674" y="218" width="36" height="6" rx="3" fill="#A86B12"/>
    <text x="674" y="264" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" font-weight="700" fill="#2A211C">Preparando</text>
    <text x="674" y="294" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#6F625A">preparing</text>
  </g>
  <path d="M900 258 H958" stroke="#B4532A" stroke-width="3" marker-end="url(#ar)"/>
  <text x="930.0" y="242" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#B4532A">PATCH</text>
  <g>
    <rect x="970" y="196" width="240" height="124" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="970" y="196" width="240" height="124" rx="22" fill="none" stroke="#E6DAD0" stroke-width="1.5"/>
    <rect x="994" y="218" width="36" height="6" rx="3" fill="#5E7355"/>
    <text x="994" y="264" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" font-weight="700" fill="#2A211C">Pronto</text>
    <text x="994" y="294" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#6F625A">ready</text>
  </g>
  <path d="M1220 258 H1278" stroke="#B4532A" stroke-width="3" marker-end="url(#ar)"/>
  <text x="1250.0" y="242" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#B4532A">PATCH</text>
  <g>
    <rect x="1290" y="196" width="240" height="124" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="1290" y="196" width="240" height="124" rx="22" fill="none" stroke="#E6DAD0" stroke-width="1.5"/>
    <rect x="1314" y="218" width="36" height="6" rx="3" fill="#2A211C"/>
    <text x="1314" y="264" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" font-weight="700" fill="#2A211C">Finalizado</text>
    <text x="1314" y="294" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#6F625A">finished</text>
  </g>
  <rect x="330" y="372" width="1200" height="58" rx="18" fill="#E6ECE1"/>
  <text x="358" y="408" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#5E7355">GET /orders</text>
  <text x="490" y="408" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#2A211C">fila do restaurante, lida pelo perfil restaurante do app</text>
  <text x="72" y="486" font-family="'Avenir Next', Avenir, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F625A">Rascunho de contrato — nomes e transições são aceitos na SCRUM-24. Hoje a API implementa apenas GET /health.</text>

</svg>
